    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slide</title>
    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .outer{
            display: flex;
            height: 100vh;
            align-items: center;
            gap:20px;
            overflow: auto;
            background: linear-gradient(to right top,black,red);
        }

        .outer > img{
            height: 250px;
            border-radius: 15px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: transform 0.3s ease-in;
        }
        
        .outer > img:hover{
            transform: scale(1.05);
        }
        
        ::-webkit-scrollbar{
            display: none;
        }
    </style>
</head>
