<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clock by using js</title>

    <style>
         *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
         }
         .outer{
            height: 100vh;
            background-image: url("https://png.pngtree.com/thumb_back/fh260/background/20240522/pngtree-alarm-clock-black-background-image_15693270.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            color:white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap:30px;
         }

         .outer > h2{
            font-size: 60px;
            letter-spacing: 2px;
            text-transform: capitalize;
            color:rgb(241, 240, 240);
            text-shadow: 5px 6px 4px red;
         }

         .outer > h1{
            font-size: 50px;
            letter-spacing: 5px;
         }
         .outer > h3{
            font-size: 38px;
            letter-spacing: 5px;
         }
    </style>
</head>
<body>
    

    <div class="outer">
        <h2>Digital Clock By using Javascript</h2>
         
        <h1></h1>

        <h3></h3>
         
    </div>

    <script src="./app.js"></script>
</body>
</html>
